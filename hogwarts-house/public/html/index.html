<html>

<head>
  <title>Hogwarts House</title>
</head>

<body>
  <form action="/house" method="post">
    <label for="name">Name</label>
    <input type="text" name="username" id="name" required/>

    <input type="radio" name="house" id="gryffindor" value="gryffindor" required>
    <label for="gryffindor">gryffindor</label>
    <input type="radio" name="house" id="slytherin" value="slytherin" required>
    <label for="slytherin">slytherin</label>
    <input type="radio" name="house" id="ravenclaw" value="ravenclaw" required>
    <label for="ravenclaw">ravenclaw</label>
    <input type="radio" name="house" id="hufflepuff" value="hufflepuff" required>
    <label for="hufflepuff">hufflepuff</label>

    <button type="submit">Submit</button>
  </form>
</body>

</html>
